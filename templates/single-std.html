<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f4f6fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }

        /* Profile Header */

        .profile-header {
            background-color: #1e293b;
            padding: 30px;
            text-align: center;
            color: white;
        }

        .profile-header h2 {
            font-size: 23px;
            margin-top: 12px;
            font-weight: 600;
        }

        .profile-header p {
            color: #cbd5e1;
            font-size: 14px;
            margin-top: 5px;
        }

        .profile-img {
            width: 125px;
            height: 125px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
            background-color: #e2e8f0;
        }

        /* Student Information */

        .details {
            padding: 25px 30px;
        }

        .details h3 {
            font-size: 18px;
            color: #1e293b;
            margin-bottom: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #e2e8f0;
            gap: 10px;
        }

        .detail-row:last-of-type {
            border-bottom: none;
        }

        .detail-row span:first-child {
            color: #64748b;
            font-size: 14px;
        }

        .detail-row span:last-child {
            color: #1e293b;
            font-size: 14px;
            font-weight: 600;
            text-align: right;
            overflow-wrap: anywhere;
        }

        /* Attendance Status */

        .status-section {
            margin-top: 20px;
        }

        .status-section p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .present {
            background-color: #dcfce7;
            color: #166534;
        }

        .absent {
            background-color: #fee2e2;
            color: #991b1b;
        }

        /* Footer */

        .footer {
            padding: 20px 30px;
            background-color: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }

        .home-btn {
            display: block;
            text-decoration: none;
            text-align: center;
            background-color: #3b82f6;
            color: white;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .home-btn:hover {
            background-color: #2563eb;
        }

        /* Responsive */

        @media (max-width: 480px) {
            .details {
                padding: 22px;
            }

            .profile-header {
                padding: 25px;
            }
        }

    </style>
</head>

<body>

    <div class="card">

        <div class="profile-header">

            <img src="{{std[6]}}" alt="Student Image" class="profile-img">

            <h2>{{std[1]}}</h2>
            <p>Student Profile</p>

        </div>

        <div class="details">

            <h3>Personal Information</h3>

            <div class="detail-row">
                <span>Student Name</span>
                <span>{{std[1]}}</span>
            </div>

            <div class="detail-row">
                <span>Age</span>
                <span>{{std[2]}}</span>
            </div>

            <div class="detail-row">
                <span>Gender</span>
                <span>{{std[3]}}</span>
            </div>

            <div class="detail-row">
                <span>Marks</span>
                <span>{{std[4]}} / 100</span>
            </div>

            <div class="detail-row">
                <span>Course</span>
                <span>{{std[5]}}</span>
            </div>

            <div class="status-section">

                <p>Attendance Status</p>

                {% if std[7] %}
                    <span class="status present">● Present</span>
                {% else %}
                    <span class="status absent">● Absent</span>
                {% endif %}

            </div>

        </div>

        <div class="footer">

            <a href="/" class="home-btn">← Back to Home</a>

        </div>

    </div>

</body>
</html>
