<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            color: #1e293b;
        }

        /* Form Container */

        .form-container {
            width: 100%;
            max-width: 550px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        /* Form Header */

        .form-header {
            background: linear-gradient(135deg, #172554, #1e40af);
            padding: 28px 30px;
            text-align: center;
            color: white;
        }

        .form-header i {
            font-size: 32px;
            color: #93c5fd;
            margin-bottom: 12px;
        }

        .form-header h1 {
            font-size: 24px;
            font-weight: 650;
        }

        .form-header p {
            color: #bfdbfe;
            font-size: 14px;
            margin-top: 7px;
        }

        /* Form Body */

        .form-body {
            padding: 30px;
        }

        .section-title {
            color: #172554;
            font-size: 17px;
            font-weight: 650;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #3b82f6;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            color: #334155;
            background: #fff;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        input::placeholder {
            color: #94a3b8;
        }

        /* Button Section */

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #e2e8f0;
        }

        button, .back-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 9px;
            transition: 0.3s;
        }

        button {
            background: #3b82f6;
            color: white;
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(37,99,235,0.2);
        }

        .back-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .back-btn:hover {
            background: #cbd5e1;
            transform: translateY(-2px);
        }

        /* Responsive */

        @media(max-width: 480px) {

            body {
                padding: 15px;
            }

            .form-header {
                padding: 25px 20px;
            }

            .form-header h1 {
                font-size: 21px;
            }

            .form-body {
                padding: 23px 20px;
            }

            .button-group {
                gap: 9px;
            }

        }

    </style>
</head>

<body>

    <div class="form-container">

        <!-- Header -->

        <div class="form-header">

            <i class="fa-solid fa-user-plus"></i>

            <h1>Add New Student</h1>

            <p>Enter student information below</p>

        </div>

        <!-- Form -->

        <div class="form-body">

            <h3 class="section-title">
                <i class="fa-solid fa-user-pen"></i>
                Student Information
            </h3>

            <form action="/add-student" method="post">

                <div class="form-group">

                    <label>Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter student name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Age (18-60)</label>

                    <input
                        type="number"
                        name="age"
                        min="18"
                        max="60"
                        placeholder="Enter age"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Gender</label>

                    <select name="gender" required>

                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Marks (1-100)</label>

                    <input
                        type="number"
                        name="marks"
                        min="1"
                        max="100"
                        placeholder="Enter marks"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Course</label>

                    <input
                        type="text"
                        name="course"
                        placeholder="Enter course name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Image URL</label>

                    <input
                        type="url"
                        name="image"
                        placeholder="Paste student image URL"
                    >

                </div>

                <div class="form-group">

                    <label>Status</label>

                    <select name="status" required>

                        <option value="">Select Status</option>
                        <option value="1">Present</option>
                        <option value="0">Absent</option>

                    </select>

                </div>

                <!-- Buttons -->

                <div class="button-group">

                    <a href="/" class="back-btn">
                        <i class="fa-solid fa-arrow-left"></i>
                        Back
                    </a>

                    <button type="submit">
                        <i class="fa-solid fa-user-plus"></i>
                        Add Student
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
